name: Refresh data
on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC daily
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET: motherduck
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # dlt's MotherDuck destination: the database name and token.
      DESTINATION__MOTHERDUCK__CREDENTIALS__DATABASE: github
      DESTINATION__MOTHERDUCK__CREDENTIALS__PASSWORD: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: make ingest
  transform:
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET: motherduck
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: make transform
